name: Publish to PyPI Index on GitHub Pages

# Auftrag 2: Baut das Paket und publiziert es in einen eigenen PEP-503-Index
# auf GitHub Pages (gh-pages Branch). Der Index wird mit dumb-pypi generiert.
# Ausgeloest durch einen Git-Tag (z. B. v0.1.0), damit jede Veroeffentlichung
# eindeutig einer Version zugeordnet ist.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # erlaubt das Pushen auf den gh-pages Branch
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build dumb-pypi

      - name: Build (sdist + wheel)
        run: python -m build

      - name: Checkout index branch (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Add packages and regenerate index
        run: |
          mkdir -p site/packages
          cp dist/* site/packages/
          ls site/packages > package-list.txt
          dumb-pypi \
            --package-list package-list.txt \
            --packages-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/packages/ \
            --output-dir site

      - name: Commit & push index
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish ${{ github.ref_name }}"
          git push

      - name: Verify install
        run: |
          sleep 90   # warten bis GitHub Pages deployed hat
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install \
            --index-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/ \
            --extra-index-url https://pypi.org/simple \
            flaskapp==0.1.0

      - name: Upload dist as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: published-dist
          path: dist/*
