# Übung 1: CI-Build für ein Container-Image
# Ablage im eigenen Repo unter: .github/workflows/aufgabe1.yml
name: CI Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true              # WICHTIG: Image in den lokalen Docker laden,
          tags: hello-docker-ci:latest   # sonst findet 'docker run' es nicht

      - name: Run Container for Test
        run: |
          docker run -d --name test-container -p 8080:8080 hello-docker-ci:latest
          sleep 5
          curl -sf http://localhost:8080 | grep -q "Hello, World!"
          docker stop test-container
