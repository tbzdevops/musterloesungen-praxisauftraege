# Auftrag 3 / Workflow 1: SAST + SCA mit Snyk
# Ablage im DSVPWA-Fork unter: .github/workflows/aufgabe1-sast-sca.yml
name: Security - SAST & SCA (Snyk)

on:
  push:
    branches: [ "main" ]   # im eigenen Fork ist main der Default-Branch
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # noetig fuer den SARIF-Upload ins Security-Tab

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---- SCA: Open-Source-Abhaengigkeiten ----
      - name: Snyk Open Source (SCA)
        uses: snyk/actions/python@master
        continue-on-error: true   # weiterlaufen, damit das SARIF hochgeladen wird
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-sca.sarif

      - name: Upload SCA SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

      # ---- SAST: Snyk Code (statische Codeanalyse) ----
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Code (SAST)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Upload Code SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
