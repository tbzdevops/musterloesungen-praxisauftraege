name: Tag 12 — Praxis-Musterlösungen

# Belegt, dass die AI-in-DevOps-Musterlösung von Tag 12 läuft.
#   * tests — validate_discount_code (Auftrag 1): Akzeptanzkriterien der Spec
#             plus Randfälle aus dem Review, mit pytest im Wurzel-Verzeichnis
# Auftrag 2 (Prompt Injection) ist eine reine Analyseübung ohne Code.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Auftrag 1 — pytest (validate_discount_code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
