name: Tag 15 — Praxis-Musterlösung

# Belegt, dass die Musterlösung von Tag 15 stimmt. Die Praxis selbst läuft lokal
# (Snyk CLI, OWASP ZAP); dieser Workflow wiederholt die Schritte im Runner:
#   * verify    — findings.md erfüllt die Classroom-Kriterien, der Fix aus P3 ist drin
#   * sast      — P1/P3: Bandit meldet die SQL-Injection in Zeile 39 nur im unveränderten DSVPWA
#   * sqli      — P2/P3: derselbe Angriff liefert im Original alle Benutzer, nach dem Fix keinen
#   * dast-zap  — P2: OWASP ZAP Baseline gegen die laufende Anwendung, Bericht als Artefakt
#   * snyk      — P1: Snyk SCA und SAST, nur wenn das Secret SNYK_TOKEN gesetzt ist

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSVPWA_REPO: https://github.com/tbzdevops/DSVPWA
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: findings.md und Fix prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tag15/verify.sh

  sast:
    name: P1/P3 — SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - name: Unverändertes DSVPWA meldet die SQL-Injection in Zeile 39
        run: |
          git clone --depth 1 "$DSVPWA_REPO" original
          bandit -q -r original/dsvpwa -t B608 -f custom --msg-template "{relpath}:{line}" | tee before.txt || true
          grep -q "attacks.py:39$" before.txt
      - name: Nach dem Fix ist Zeile 39 nicht mehr gemeldet
        run: |
          bandit -q -r dsvpwa -t B608 -f custom --msg-template "{relpath}:{line}" | tee after.txt || true
          ! grep -q "attacks.py:39$" after.txt

  sqli:
    name: P2/P3 — SQL-Injection vorher und nachher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Original (Port 65413) und Musterlösung (Port 65414) starten
        run: |
          git clone --depth 1 "$DSVPWA_REPO" original
          (cd original && nohup python dsvpwa.py --host 127.0.0.1 --port 65413 > ../original.log 2>&1 &)
          nohup python dsvpwa.py --host 127.0.0.1 --port 65414 > fixed.log 2>&1 &
          for port in 65413 65414; do
            for i in $(seq 1 20); do curl -sf -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
          done
      - name: Angriff vergleichen
        run: |
          # DSVPWA schreibt alle Tabellenzeilen in eine Zeile: Treffer zählen, nicht Zeilen
          users() { curl -s "http://127.0.0.1:$1/users?id=$2" | grep -o "<tr><td>[0-9]*</td>" | wc -l; }
          before=$(users 65413 "1%20OR%201=1"); after=$(users 65414 "1%20OR%201=1"); normal=$(users 65414 1)
          echo "Original,  id=1 OR 1=1: $before Benutzer"
          echo "Mit Fix,   id=1 OR 1=1: $after Benutzer"
          echo "Mit Fix,   id=1:        $normal Benutzer"
          [ "$before" -gt 1 ] && [ "$after" -eq 0 ] && [ "$normal" -eq 1 ]

  dast-zap:
    name: P2 — DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: DSVPWA starten
        run: |
          nohup python dsvpwa.py --host 0.0.0.0 > dsvpwa.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:65413/ && break; sleep 1; done
          curl -s -D - -o /dev/null http://localhost:65413/
      - name: ZAP-Baseline-Scan wie in P2
        run: |
          mkdir -p zap && chmod 777 zap
          # -I: Warnungen brechen den Lauf nicht ab, der Baseline-Scan informiert nur
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" -t zaproxy/zap-stable \
            zap-baseline.py -t http://localhost:65413 -r zap-report.html -I | tee zap/zap-output.txt
          grep -E "^(WARN|FAIL)-NEW" zap/zap-output.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap/

  snyk:
    name: P1 — Snyk SCA und SAST (optional)
    runs-on: ubuntu-latest
    steps:
      - name: SNYK_TOKEN vorhanden?
        id: guard
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::SNYK_TOKEN nicht gesetzt, Snyk-Scan übersprungen"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snyk/actions/setup@master
        if: steps.guard.outputs.run == 'true'
      - name: snyk test und snyk code test
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true   # DSVPWA ist absichtlich verwundbar
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          pip install -r requirements.txt
          snyk test || true
          snyk code test
