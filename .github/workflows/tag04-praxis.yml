name: Tag 04 — Praxis-Musterlösungen

# Führt die drei Musterlösungen von Tag 04 wirklich aus, damit sichtbar ist,
# dass sie grün laufen. Die Workflow-Dateien in den einzelnen Auftrags-Ordnern
# (z. B. tag04/auftrag01-hello-ci/.github/workflows/hello-ci.yml) sind die
# Vorlagen für das eigene Repo der Studierenden — GitHub führt nur Workflows
# im Wurzel-Ordner .github/workflows/ aus.

on:
  push:
    paths:
      - "tag04/**"
      - ".github/workflows/tag04-praxis.yml"
  pull_request:
    paths:
      - "tag04/**"
      - ".github/workflows/tag04-praxis.yml"
  workflow_dispatch:

jobs:
  auftrag01-hello:
    name: Auftrag 1 — Hello CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Hello
        run: echo "🎉 Hello Continuous Integration!"

  auftrag02-build-test:
    name: Auftrag 2 — Build und Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tag04/auftrag02-build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Tests
        run: pytest -q

  auftrag03-lint-docker:
    name: Auftrag 3 — Linter und Docker-Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tag04/auftrag03-lint-docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Linter
        run: flake8 .
      - name: Run Tests
        run: pytest -q
      - name: Build Docker Image
        run: docker build -t myapp:latest .
