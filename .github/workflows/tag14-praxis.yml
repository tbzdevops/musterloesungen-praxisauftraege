name: Tag 14 — Praxis-Musterlösung

# Belegt den automatisierten Container-Build von Tag 14: Image bauen,
# Container starten, HTTP-Antwort prüfen.
# aufgabe1.yml liegt im Wurzel-Ordner .github/workflows/, genau so wie im
# eigenen Repo der Studierenden. Er ist auf 'branches: [main]' begrenzt und
# läuft deshalb auf diesem Lösungs-Branch nicht an. Dieser Workflow führt
# dieselben Schritte hier beweisbar aus.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uebung-ci-build:
    name: CI-Build (Image + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t hello-docker-ci:latest .
      - name: Container starten und testen
        run: |
          docker run -d --name test-container -p 8080:8080 hello-docker-ci:latest
          sleep 5
          BODY=$(curl -sf http://localhost:8080/)
          echo "Antwort: $BODY"
          echo "$BODY" | grep -q "Hello, World!"
          docker stop test-container
