name: Tag 14 — Praxis-Musterlösungen

# Belegt die Container-Automatisierung von Tag 14.
#   * uebung01-ci-build — Image bauen, Container starten, HTTP-Antwort prüfen (beweisbar grün)
#   * validate-aws      — die ECR-/ECS-Workflows (Übung 2+3) sind gültiges YAML
# aufgabe1/2/3.yml liegen im Wurzel-Ordner .github/workflows/, genau so wie im
# eigenen Repo der Studierenden. Sie sind auf 'branches: [main]' begrenzt und
# laufen deshalb auf diesem Loesungs-Branch nicht an — Uebung 2 und 3 brauchen
# ausserdem AWS-Secrets. Dieser Workflow baut/testet Uebung 1 hier beweisbar.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uebung01-ci-build:
    name: Übung 1 — CI-Build (Image + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t hello-docker-ci:latest .
      - name: Container starten und testen
        run: |
          docker run -d --name test-container -p 8080:8080 hello-docker-ci:latest
          sleep 5
          BODY=$(curl -sf http://localhost:8080/)
          echo "Antwort: $BODY"
          echo "$BODY" | grep -q "Hello, World!"
          docker stop test-container

  validate-aws-workflows:
    name: Übung 2/3 — AWS-Workflows (YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Workflows sind gültiges YAML
        run: |
          python - <<'PY'
          import yaml, pathlib
          base = pathlib.Path(".github/workflows")
          for name in ["aufgabe1.yml", "aufgabe2.yml", "aufgabe3.yml"]:
              wf = yaml.safe_load((base / name).read_text())
              assert "jobs" in wf, f"{name}: jobs fehlt"
              print("OK", name)
          # Pflicht-Bausteine der AWS-Workflows
          ecr = (base / "aufgabe2.yml").read_text()
          ecs = (base / "aufgabe3.yml").read_text()
          assert "amazon-ecr-login" in ecr, "ECR-Login fehlt in aufgabe2"
          assert "amazon-ecs-deploy-task-definition" in ecs, "ECS-Deploy fehlt in aufgabe3"
          print("OK  AWS-Bausteine vorhanden")
          PY
