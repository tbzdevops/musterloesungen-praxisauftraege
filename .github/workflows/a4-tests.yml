# Auftrag 1 - Bug 4 (behoben): working-directory entfernt, Tests liegen in tests/.
name: A4 Testpfad

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhaengigkeiten installieren
        run: pip install pytest
      - name: Tests
        run: pytest -q
